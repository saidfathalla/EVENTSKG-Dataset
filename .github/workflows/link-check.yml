name: Link Checker

# Runs on every push to master/main, every Sunday at midnight (UTC), and on demand.
on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  # Links in the README and other Markdown files, the HTML documentation
  # and SPARQL explorer, and the dataset description (download URLs,
  # provenance files, scripts and vocabulary namespaces).
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lychee broken link checker
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: >-
            --verbose --no-progress
            --max-retries 3 --retry-wait-time 5
            --accept 200..=299,403,429
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '^https?://(dx\.)?doi\.org/10\.1007/'
            --exclude '^https?://rdfs\.org/ns/'
            --timeout 30
            './**/*.md' 'docs/*.html' 'VoID.ttl' 'data/eventskg-metadata.ttl'
          fail: true
