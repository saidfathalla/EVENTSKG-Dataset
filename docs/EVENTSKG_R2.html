<hr style="margin: 30px 0;">
<h2>EVENTSKG Public SPARQL Endpoint (In-Browser Engine)</h2>
<p>Query the enriched EVENTSKG dataset directly inside your browser:</p>

<div id="yasgui" style="margin-bottom: 30px;"></div>

<!-- 1. YASGUI CSS & JS -->
<link href="https://unpkg.com/@triply/yasgui@4.2.25/build/yasgui.min.css" rel="stylesheet" />
<script src="https://unpkg.com/@triply/yasgui@4.2.25/build/yasgui.min.js"></script>

<!-- 2. Comunica In-Browser SPARQL Engine -->
<script src="https://rdf.js.org/comunica-browser/versions/v2/packages/actor-init-sparql/comunica-browser.js"></script>

<script>
    // Since your HTML is inside the 'docs/' folder and the TTL is in the root directory, 
    // use '../EVENTSKG.ttl' (or '../EVENTSKG.TTL' matching your exact file case).
    const DATASET_URL = "../EVENTSKG.ttl";

    // Initialize Comunica engine instance once
    const engine = Comunica.newEngine();

    // Initialize YASGUI with a custom queryFunction to execute queries locally via Comunica
    const yasgui = new Yasgui(document.getElementById("yasgui"), {
        requestConfig: {
            endpoint: DATASET_URL,
            // Custom queryFunction intercepts execution and avoids HTTP POST requests
            queryFunction: async (instance, endpoint, query) => {
                try {
                    // Execute SPARQL query in-browser against the static TTL file
                    const result = await engine.query(query, {
                        sources: [endpoint]
                    });
                    
                    // Convert stream to SPARQL-JSON format string
                    const jsonResult = await engine.resultToAnswerOutput(result, 'application/sparql-results+json');
                    
                    // Return parsed JSON object directly to YASGUI results table
                    return JSON.parse(jsonResult);
                } catch (err) {
                    console.error("Comunica Execution Error:", err);
                    throw new Error("Query execution failed: " + err.message);
                }
            }
        },
        autofocus: false
    });

    // Set sample SPARQL query in the editor tab
    const currentTab = yasgui.getTab();
    currentTab.setSetQuery?.(currentTab.setQuery(`PREFIX eventskg: <http://w3id.org/EVENTSKG-Dataset/ekg#>
PREFIX seo: <https://w3id.org/seo#>
PREFIX conference-ontology: <https://w3id.org/scholarlydata/ontology/conference-ontology.owl#>

SELECT ?event ?title ?city ?country WHERE {
  ?event a seo:Symposium ;
         conference-ontology:title ?title ;
         seo:city ?city ;
         seo:heldInCountry ?country .
}
LIMIT 10`));
</script>
